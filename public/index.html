<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>luckrig tracker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="hero">
      <p class="eyebrow">luckrig tracker prototype</p>
      <h1>今この瞬間、誰かのリグで動いているLLM推論API</h1>
      <p class="lead">
        OpenAI互換APIを喋るオンプレミスノードの公開リスト。SLAなし、保証なし。
        ただし、どんな構成が今動いているかを見えるようにする。
      </p>
      <div class="actions">
        <button id="refresh" type="button">更新</button>
        <label class="filter">
          <span>status</span>
          <select id="status-filter">
            <option value="all">all</option>
            <option value="available">available</option>
            <option value="unavailable">unavailable</option>
            <option value="unknown">unknown</option>
          </select>
        </label>
        <label class="filter">
          <span>model</span>
          <input id="model-filter" type="search" placeholder="Qwen / llama..." />
        </label>
        <label class="filter">
          <span>GPU</span>
          <input id="gpu-filter" type="search" placeholder="RTX / M3 / CPU" />
        </label>
        <label class="filter">
          <span>min VRAM</span>
          <input id="min-vram-filter" type="number" min="0" step="1" placeholder="GB" />
        </label>
      </div>
    </header>

    <main>
      <section class="notice trust-notice">
        <strong>trust model:</strong> luckrigは「頑張らなければ見えない」ための実験的な設計です。
        通常のログやtcpdumpに平文を残さないことを目指しますが、ノード提供者がプロセス内部に踏み込めばプロンプト/出力を見られます。
        試食前にはnode public key fingerprintを別経路で確認してください。
      </section>

      <section class="summary" id="summary" aria-live="polite"></section>
      <section class="compare" id="compare" aria-live="polite"></section>
      <section class="nodes" id="nodes" aria-live="polite"></section>
    </main>

    <template id="node-card-template">
      <article class="node-card">
        <div class="card-topline">
          <span class="status-pill"></span>
          <span class="rarity"></span>
        </div>
        <h2></h2>
        <dl class="specs">
          <div><dt>model</dt><dd data-field="model_name"></dd></div>
          <div><dt>quant</dt><dd data-field="quantization"></dd></div>
          <div><dt>LoRA</dt><dd data-field="lora"></dd></div>
          <div><dt>GPU</dt><dd data-field="gpu"></dd></div>
          <div><dt>VRAM</dt><dd data-field="vram_gb"></dd></div>
          <div><dt>ctx</dt><dd data-field="context_length"></dd></div>
        </dl>
        <p class="availability"></p>
        <p class="note"></p>
        <div class="tags"></div>
        <section class="fingerprint-panel">
          <div class="fingerprint-title">node public key fingerprint</div>
          <code class="fingerprint-value"></code>
          <div class="fingerprint-actions">
            <button class="copy-fingerprint" type="button">copy fingerprint</button>
            <span class="fingerprint-help"></span>
          </div>
        </section>
        <details class="tasting-panel">
          <summary>試食する / browser POC</summary>
          <div class="tasting-grid">
            <label>
              <span>proxy URL</span>
              <input class="tasting-proxy-url" type="url" />
            </label>
            <label>
              <span>user id</span>
              <input class="tasting-user-id" type="text" value="browser-poc" />
            </label>
            <label>
              <span>contribution score</span>
              <input class="tasting-score" type="number" min="0" step="1" value="0" />
            </label>
          </div>
          <label class="prompt-label fingerprint-confirm-label">
            <span>fingerprint確認（別経路で確認した値を貼り付け）</span>
            <input class="fingerprint-confirm" type="text" placeholder="sha256:..." />
          </label>
          <label class="prompt-label">
            <span>prompt</span>
            <textarea class="tasting-prompt" rows="4" placeholder="このノードで試したい短いプロンプト"></textarea>
          </label>
          <label class="trust-check">
            <input class="tasting-trust" type="checkbox" />
            <span>trust modelを理解しました。ノード提供者がプロセス内部に踏み込めば平文を見られること、fingerprintを別経路で確認し、上の入力欄に一致する値を貼り付けたことを了承します。</span>
          </label>
          <div class="tasting-actions">
            <button class="run-tasting" type="button">token取得 → 暗号化 → 試食</button>
            <span class="tasting-status"></span>
          </div>
          <pre class="tasting-output" hidden></pre>
          <a class="replay-download" hidden download>download replay JSON</a>
        </details>
        <footer class="health"></footer>
        <footer class="observations"></footer>
      </article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
