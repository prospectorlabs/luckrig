<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2735"/>
      <stop offset="1" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a25"/>
      <stop offset="1" stop-color="#11131c"/>
    </linearGradient>
  </defs>
  <rect width="720" height="720" fill="url(#bg)"/>

  <g transform="translate(40,40)">
    <rect width="640" height="640" rx="22" fill="url(#card)" stroke="#2a2f3f"/>
    <g transform="translate(24,24)">
      <rect width="92" height="24" rx="12" fill="#0a0a0a" stroke="#3d6a4a"/>
      <text x="46" y="16" fill="#65d487" font-size="11" text-anchor="middle">available</text>
      <g transform="translate(500,0)">
        <rect width="92" height="24" rx="12" fill="#0a0a0a" stroke="#2a2f3f"/>
        <text x="46" y="16" fill="#a3a9b8" font-size="11" text-anchor="middle">scarcity 1.00</text>
      </g>
      <text x="0" y="56" fill="#f5f7fb" font-size="20" font-weight="700">初号5090 / Qwen3-35B-A3B</text>

      <!-- Tasting panel container -->
      <g transform="translate(0,86)">
        <rect width="592" height="478" rx="14" fill="#000814" stroke="#2a2f3f"/>
        <text x="16" y="26" fill="#c6ff6b" font-size="13" font-weight="700">▾ 試食する / browser POC</text>

        <!-- grid inputs -->
        <g transform="translate(16,50)" font-size="11" fill="#a3a9b8">
          <text x="0" y="0">proxy URL</text>
          <rect x="0" y="6" width="560" height="32" rx="10" fill="#1a1d28" stroke="#2a2f3f"/>
          <text x="10" y="27" fill="#f5f7fb">http://127.0.0.1:8788/v1</text>

          <text x="0" y="60">user id</text>
          <rect x="0" y="66" width="272" height="32" rx="10" fill="#1a1d28" stroke="#2a2f3f"/>
          <text x="10" y="87" fill="#f5f7fb">browser-poc</text>

          <text x="288" y="60">contribution score</text>
          <rect x="288" y="66" width="272" height="32" rx="10" fill="#1a1d28" stroke="#2a2f3f"/>
          <text x="298" y="87" fill="#f5f7fb">1</text>

          <text x="0" y="120">prompt</text>
          <rect x="0" y="126" width="560" height="86" rx="10" fill="#1a1d28" stroke="#2a2f3f"/>
          <text x="10" y="148" fill="#f5f7fb">RTX 5090でQwen3を回したらどれくらい速いの?</text>
          <text x="10" y="166" fill="#f5f7fb">短く5行で答えて。</text>
        </g>

        <!-- trust check -->
        <g transform="translate(16,288)">
          <rect width="14" height="14" rx="3" fill="#c6ff6b" stroke="#c6ff6b"/>
          <path d="M3 7 L6 10 L11 4" stroke="#0a0a14" fill="none" stroke-width="2"/>
          <text x="22" y="6" fill="#a3a9b8" font-size="11">通常ログやtcpdumpでそのまま見えないよう処理されますが、</text>
          <text x="22" y="22" fill="#a3a9b8" font-size="11">ノード提供者から完全に隠せるわけではありません。</text>
          <text x="22" y="38" fill="#a3a9b8" font-size="11">機密情報、個人情報、業務上守るべき内容を送らないことを了承します。</text>
        </g>

        <!-- action -->
        <g transform="translate(16,360)">
          <rect width="252" height="36" rx="18" fill="#11131c" stroke="#6b8b3b"/>
          <text x="126" y="22" fill="#c6ff6b" font-size="13" font-weight="700" text-anchor="middle">token取得 → 試食</text>
          <text x="268" y="23" fill="#a3a9b8" font-size="11">waiting for proxy / pseudo SSE...</text>
        </g>

        <!-- output -->
        <g transform="translate(16,410)">
          <rect width="560" height="56" rx="10" fill="rgba(0,0,0,.4)" stroke="#2a2f3f"/>
          <text x="12" y="20" fill="#f5f7fb" font-size="11" font-family="ui-monospace, monospace">mock:RTX 5090でQwen3を回したらどれくらい速いの?</text>
          <text x="12" y="36" fill="#f5f7fb" font-size="11" font-family="ui-monospace, monospace">短く5行で答えて。</text>
        </g>
      </g>
    </g>
  </g>
</svg>
