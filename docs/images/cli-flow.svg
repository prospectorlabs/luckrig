<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="1080" height="580" fill="#0a0e15"/>
  <g transform="translate(20,20)">
    <rect width="1040" height="540" rx="14" fill="#0e131c" stroke="#1f2533"/>
    <g transform="translate(16,12)">
      <circle cx="6" cy="6" r="6" fill="#ff6b7a"/>
      <circle cx="26" cy="6" r="6" fill="#ffce5c"/>
      <circle cx="46" cy="6" r="6" fill="#65d487"/>
      <text x="80" y="11" fill="#a3a9b8" font-size="12" font-family="system-ui">luckrig — terminal walkthrough</text>
    </g>

    <g transform="translate(20,52)" font-size="13">
      <text x="0" y="0" fill="#65d487">$</text>
      <text x="18" y="0" fill="#f5f7fb">node src/cli/luckrig.js keygen --out-prefix node</text>
      <text x="0" y="22" fill="#a3a9b8">{</text>
      <text x="18" y="22" fill="#c6ff6b">"public_key_path"</text>
      <text x="166" y="22" fill="#a3a9b8">: </text>
      <text x="188" y="22" fill="#f5f7fb">"node-public.pem",</text>
      <text x="18" y="40" fill="#c6ff6b">"private_key_path"</text>
      <text x="172" y="40" fill="#a3a9b8">: </text>
      <text x="194" y="40" fill="#f5f7fb">"node-private.pem"</text>
      <text x="0" y="58" fill="#a3a9b8">}</text>

      <text x="0" y="100" fill="#65d487">$</text>
      <text x="18" y="100" fill="#f5f7fb">LUCKRIG_DEV=1 LUCKRIG_TRACKER_SECRET=dev-secret npm start</text>
      <text x="0" y="120" fill="#a3a9b8">[tracker] listening on http://127.0.0.1:8787</text>
      <text x="0" y="138" fill="#a3a9b8">[tracker] registry=data/nodes.seed.json</text>
      <text x="0" y="156" fill="#a3a9b8">[tracker] nodes=3 health_interval=30000ms</text>

      <text x="0" y="200" fill="#65d487">$</text>
      <text x="18" y="200" fill="#f5f7fb">LUCKRIG_NODE_ID=first-5090-qwen3 \</text>
      <text x="40" y="218" fill="#f5f7fb">LUCKRIG_TRACKER_SECRET=dev-secret \</text>
      <text x="40" y="236" fill="#f5f7fb">LUCKRIG_NODE_PRIVATE_KEY="$(cat node-private.pem)" \</text>
      <text x="40" y="254" fill="#f5f7fb">node src/proxy/server.js</text>
      <text x="0" y="274" fill="#a3a9b8">[proxy] listening on http://127.0.0.1:8788</text>
      <text x="0" y="292" fill="#a3a9b8">[proxy] node_id=first-5090-qwen3</text>

      <text x="0" y="336" fill="#65d487">$</text>
      <text x="18" y="336" fill="#f5f7fb">node src/cli/luckrig.js register \</text>
      <text x="40" y="354" fill="#f5f7fb">--tracker http://127.0.0.1:8787 \</text>
      <text x="40" y="372" fill="#f5f7fb">--id first-5090-qwen3 \</text>
      <text x="40" y="390" fill="#f5f7fb">--endpoint-url http://127.0.0.1:8788/v1 \</text>
      <text x="40" y="408" fill="#f5f7fb">--model-name Qwen3-35B-A3B --quantization Q4_K_XL \</text>
      <text x="40" y="426" fill="#f5f7fb">--gpu RTX_5090 --vram-gb 32 --context-length 65536 \</text>
      <text x="40" y="444" fill="#f5f7fb">--node-public-key "$(cat node-public.pem)"</text>
      <text x="0" y="464" fill="#c6ff6b">{ schema_version: 1, node: { id: "first-5090-qwen3", … } }</text>

      <text x="0" y="500" fill="#65d487">$</text>
      <text x="18" y="500" fill="#f5f7fb">npm test</text>
      <text x="0" y="518" fill="#65d487">[smoke] ok   [e2e] ok</text>
    </g>
  </g>
</svg>
