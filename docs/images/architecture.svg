<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="1080" height="540" fill="#0a0e15"/>
  <g font-size="13" fill="#f5f7fb">
    <!-- Browser -->
    <g transform="translate(60,60)">
      <rect width="240" height="120" rx="16" fill="#11131c" stroke="#2a2f3f"/>
      <text x="20" y="32" font-weight="700">Browser / Client</text>
      <text x="20" y="58" fill="#a3a9b8">公開リスト閲覧</text>
      <text x="20" y="78" fill="#a3a9b8">tasting POC panel</text>
      <text x="20" y="98" fill="#a3a9b8">replay JSON download</text>
    </g>
    <!-- Tracker -->
    <g transform="translate(420,60)">
      <rect width="240" height="180" rx="16" fill="#11131c" stroke="#c6ff6b"/>
      <text x="20" y="32" font-weight="700" fill="#c6ff6b">Tracker :8787</text>
      <text x="20" y="58" fill="#a3a9b8">/api/nodes</text>
      <text x="20" y="78" fill="#a3a9b8">/api/health</text>
      <text x="20" y="98" fill="#a3a9b8">/api/tokens</text>
      <text x="20" y="118" fill="#a3a9b8">/api/metrics</text>
      <text x="20" y="146" fill="#65d487">node registry + JSONL metrics</text>
    </g>
    <!-- Proxy -->
    <g transform="translate(780,60)">
      <rect width="240" height="220" rx="16" fill="#11131c" stroke="#ffce5c"/>
      <text x="20" y="32" font-weight="700" fill="#ffce5c">Node Proxy :8788</text>
      <text x="20" y="58" fill="#a3a9b8">/health</text>
      <text x="20" y="78" fill="#a3a9b8">/v1/chat/completions</text>
      <text x="20" y="100" fill="#a3a9b8">token verify</text>
      <text x="20" y="120" fill="#a3a9b8">subtext decode/encode</text>
      <text x="20" y="140" fill="#a3a9b8">buffer → pseudo SSE</text>
      <text x="20" y="170" fill="#65d487">CORS有効</text>
    </g>
    <!-- Upstream -->
    <g transform="translate(780,320)">
      <rect width="240" height="120" rx="16" fill="#11131c" stroke="#2a2f3f"/>
      <text x="20" y="32" font-weight="700">Upstream LLM</text>
      <text x="20" y="58" fill="#a3a9b8">llama.cpp / ollama / mock</text>
      <text x="20" y="78" fill="#a3a9b8">OpenAI互換</text>
    </g>
    <!-- Replay -->
    <g transform="translate(60,320)">
      <rect width="240" height="120" rx="16" fill="#11131c" stroke="#2a2f3f"/>
      <text x="20" y="32" font-weight="700">~/.luckrig/history</text>
      <text x="20" y="58" fill="#a3a9b8">replay JSON</text>
      <text x="20" y="78" fill="#a3a9b8">schema_version: 1</text>
      <text x="20" y="98" fill="#a3a9b8">local-first</text>
    </g>

    <!-- Arrows -->
    <g stroke="#a3a9b8" stroke-width="1.5" fill="none">
      <path d="M300,120 L420,120" marker-end="url(#arr)"/>
      <path d="M660,120 L780,120" marker-end="url(#arr)"/>
      <path d="M900,280 L900,320" marker-end="url(#arr)"/>
      <path d="M780,180 C600,260 360,300 300,360" marker-end="url(#arr)"/>
      <path d="M420,180 L300,360" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    </g>
    <defs>
      <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <path d="M0,0 L9,3 L0,6 z" fill="#a3a9b8"/>
      </marker>
    </defs>
    <g fill="#a3a9b8" font-size="11">
      <text x="304" y="112">GET / POST</text>
      <text x="668" y="112">token + probe</text>
      <text x="908" y="306">forward</text>
      <text x="430" y="262">pseudo SSE</text>
      <text x="334" y="234">tasting result</text>
    </g>
  </g>
</svg>
