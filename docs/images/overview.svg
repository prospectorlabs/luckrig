  <rect width="1280" height="760" fill="url(#bg)"/>

  <!-- Hero -->
  <g transform="translate(80,60)">
    <text x="0" y="0" fill="#c6ff6b" font-size="12" font-weight="700" letter-spacing="1.6">LUCKRIG TRACKER PROTOTYPE</text>
    <text x="0" y="48" fill="#f5f7fb" font-size="40" font-weight="700">今この瞬間、誰かのリグで動いているLLM推論API</text>
    <text x="0" y="92" fill="#a3a9b8" font-size="16">OpenAI互換APIを喋るオンプレミスノードの公開リスト。SLAなし、保証なし。</text>
    <text x="0" y="116" fill="#a3a9b8" font-size="16">ただし、どんな構成が今動いているかを見えるようにする。</text>
    <!-- buttons -->
    <g transform="translate(0,148)">
      <rect width="74" height="36" rx="18" fill="#11131c" stroke="#2a2f3f"/>
      <text x="37" y="23" fill="#f5f7fb" font-size="14" text-anchor="middle">更新</text>
      <g transform="translate(96,0)">
        <rect width="160" height="36" rx="18" fill="#11131c" stroke="#2a2f3f"/>
        <text x="14" y="23" fill="#a3a9b8" font-size="13">status</text>
        <text x="58" y="23" fill="#f5f7fb" font-size="13">all ▾</text>
      </g>
    </g>
  </g>

  <!-- Notice -->
  <g transform="translate(80,272)">
    <rect width="1120" height="76" rx="18" fill="#0f1320" stroke="#5a4a1f"/>
    <text x="20" y="30" fill="#f5f7fb" font-size="14" font-weight="700">送信内容について:</text>
    <text x="150" y="30" fill="#a3a9b8" font-size="14">通常の通信観測や素朴なログにプロンプト/出力がそのまま残らないよう処理します。</text>
    <text x="20" y="54" fill="#a3a9b8" font-size="14">ただしノード提供者がプロセス内部に踏み込めば平文を見られます。機密情報は送らないでください。</text>
  </g>

